name: Deploy production (FTP)

# Builds the frontend and publishes via FTP:
#   - frontend/dist/  -> webroot (or /dashboard/)
#   - deploy/         -> api/ and data/ (config.php excluded)
#
# Runs on push to main or manually (workflow_dispatch).
# Required secrets: FTP_HOST, FTP_USERNAME, FTP_PASSWORD, FTP_DIR.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; new runs cancel queued ones.
concurrency:
  group: deploy-produzione
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Publishes the frontend build to the webroot.
      - name: Deploy frontend (dist/) via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: ${{ secrets.FTP_DIR }}

      # Publishes backend (api/ and data/). NOTE: config.php is excluded so
      # that token/credentials/setup already present in production are not
      # overwritten.
      - name: Deploy backend (api/ and data/) via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            ./.htaccess
            ./data/config.php

      # Uploads dist/ as a backup artifact of the run.
      - name: Upload artifact (dist/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpi-dashboard-dist
          path: frontend/dist
          if-no-files-found: warn
          retention-days: 7
