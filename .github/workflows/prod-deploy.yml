name: Deploy production (FTPS)

# Builds the SPA frontend and publishes EVERYTHING (frontend + backend) into a
# single remote folder whose default is <FTP-home>/dashboard/ (configurable).
#
# Final remote layout (default server-dir = "dashboard/"):
#   dashboard/
#     index.html        <- compiled SPA frontend (what the browser loads)
#     assets/…          <- hashed JS/CSS bundles
#     example.htaccess  <- Basic Auth TEMPLATE (deployed every time; copied to
#                          .htaccess by first_setup.php with the real path)
#     first_setup.php   <- one-time bootstrap (POST) - generates the
#                          server-owned files below, then self-seals
#     api/
#       .htaccess       <- rewrite api/config, api/config/metrics(/{key}),
#                          api/metrics, api/metrics/latest -> metrics.php
#       metrics.php     <- the whole backend (server side API)
#       HELP.html       <- API reference for humans/AI agents
#       openapi.yaml    <- machine-readable OpenAPI spec of the same API
#     data/
#       .htaccess       <- denies web access to data/
#       seed.sqlite     <- seed for brand-new installs (copied -> kpi.sqlite
#                          by first_setup.php only when the live DB is empty)
#
# The following are NEVER uploaded (server-owned, created/generated once by
# first_setup.php; they are not part of this bundle, so the FTPS action never
# tracks them in its sync-state and can never overwrite or delete them):
#   .htaccess             <- Basic Auth, generated by first_setup.php from
#                            example.htaccess with the real AuthUserFile path
#   .htpasswd             <- viewer credentials (same folder as .htaccess)
#   data/config.php       <- API_TOKEN (Bearer), DB path
#   data/kpi.sqlite       <- the LIVE database (metrics config + data points)
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   ftp_host            FTP(S) host
#   ftp_username        FTP(S) username
#   ftp_password        FTP(S) password
# Optional secret:
#   ftp_port            FTPS port (default 21)
#
# Configurable target folder (must end with '/'):
#   1. "deploy_dir" input of the manual run (workflow_dispatch), or
#   2. repository variable DEPLOY_DIR (Settings -> Variables), or
#   3. default: "dashboard/"
#
# Uses SamKirkland/FTP-Deploy-Action@v4.4.0 with protocol: ftps and lowercase
# secrets.

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      deploy_dir:
        description: >-
          Remote folder to deploy into, relative to FTP home (trailing "/"
          required). Overrides the DEPLOY_DIR variable. Default: dashboard/
        required: false
        default: ''

# Only one deploy at a time; a new run cancels the queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Assemble a single folder with the exact content of the remote
      # "dashboard/" directory, so the FTPS sync is one atomic pass.
      # Only the intended files are copied (never whole directories), so
      # dev-only or unexpected files can never reach the server.
      - name: Assemble deploy bundle
        run: |
          set -eu
          rm -rf release
          mkdir -p release/api release/data

          # 1) Compiled SPA: index.html + assets/…
          cp -a frontend/dist/. release/
          #    dist/ no longer contains an .htaccess (Basic Auth is handled
          #    by example.htaccess + first_setup.php below). Belt-and-
          #    suspenders: drop any stale .htaccess a locally-built dist/
          #    could still contain.
          rm -f release/.htaccess

          # 1b) Basic Auth template - deployed as example.htaccess every time.
          #     first_setup.php copies it to the live .htaccess ONCE and fills
          #     in the real AuthUserFile path (see deploy/example.htaccess).
          cp deploy/example.htaccess release/

          # 1c) One-time server bootstrap (POST; generates the live .htaccess
          #     from example.htaccess, .htpasswd, config.php and seeds the
          #     live DB, then self-seals)
          cp deploy/first_setup.php release/

          # 2) Backend API (server side API, managed by metrics.php)
          cp deploy/api/metrics.php release/api/
          cp deploy/api/.htaccess release/api/
          # 2b) API documentation (shipped next to the API)
          cp deploy/api/HELP.html release/api/
          cp deploy/api/openapi.yaml release/api/

          # 3) data/ web protection only + a seed for brand-new installs.
          #    deploy/data/config.php and deploy/data/kpi.sqlite are
          #    deliberately NOT copied: config.php (API_TOKEN) and the LIVE
          #    database (kpi.sqlite) are server-owned — config.php is
          #    generated by first_setup.php, kpi.sqlite is created from
          #    seed.sqlite only when the live DB is empty/missing.
          cp deploy/data/.htaccess release/data/
          cp deploy/data/kpi.sqlite release/data/seed.sqlite

          echo "== release tree =="
          find release -type f | sort

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ftp_host }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          protocol: ftps
          port: ${{ secrets.ftp_port || '21' }}
          local-dir: ./release/
          server-dir: ${{ inputs.deploy_dir || vars.DEPLOY_DIR || 'dashboard/' }}
          # IMPORTANT exclude note: the action filters with
          # matchBase:true (gitignore-like), so a bare ".htaccess" pattern
          # matches the BASENAME at ANY depth - it would also exclude
          # api/.htaccess and data/.htaccess (which MUST be deployed). Do
          # NOT add a bare ".htaccess"/".htpasswd" here.
          #
          # The root .htaccess and .htpasswd are generated once by
          # first_setup.php and are NOT part of this bundle, so they are
          # never in the action's sync-state file and are therefore never
          # deleted or overwritten by a deploy (no exclusion needed).
          # data/config.php and data/kpi.sqlite are server-owned too and are
          # excluded here for the same reason (these paths contain "/", so
          # they only match data/, never api/ or the root).
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            data/config.php
            data/kpi.sqlite
            data/kpi.sqlite-*
          log-level: verbose

      # Keeps a downloadable copy of the exact bundle that was deployed.
      - name: Upload artifact (release/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpi-dashboard-release
          path: release
          if-no-files-found: warn
          retention-days: 7
