name: Deploy production (FTPS)

# Builds the SPA frontend and publishes EVERYTHING (frontend + backend) into a
# single remote folder whose default is <FTP-home>/dashboard/ (configurable).
#
# Final remote layout (default server-dir = "dashboard/"):
#   dashboard/
#     index.html        <- compiled SPA frontend (what the browser loads)
#     assets/…          <- hashed JS/CSS bundles
#     .htaccess         <- Basic Auth for the dashboard/GETs + POST exemption
#     api/
#       .htaccess       <- rewrite api/config, api/config/metrics(/{key}),
#                          api/metrics, api/metrics/latest -> metrics.php
#       metrics.php     <- the whole backend (server side API)
#       HELP.html       <- API reference for humans/AI agents
#       openapi.yaml    <- machine-readable OpenAPI spec of the same API
#     data/
#       .htaccess       <- denies web access to data/
#       (config.php is NEVER uploaded: it is owned/managed on the server and
#        is left untouched so tokens/credentials/setup are never overwritten)
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   ftp_host            FTP(S) host
#   ftp_username        FTP(S) username
#   ftp_password        FTP(S) password
# Optional secret:
#   ftp_port            FTPS port (default 21)
#
# Configurable target folder (must end with '/'):
#   1. "deploy_dir" input of the manual run (workflow_dispatch), or
#   2. repository variable DEPLOY_DIR (Settings -> Variables), or
#   3. default: "dashboard/"
#
# Only the trailing "Deploy" part follows the RopeDataSheet prod-deploy.yml
# (SamKirkland/FTP-Deploy-Action@v4.4.0 + protocol: ftps + lowercase secrets).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_dir:
        description: >-
          Remote folder to deploy into, relative to FTP home (trailing "/"
          required). Overrides the DEPLOY_DIR variable. Default: dashboard/
        required: false
        default: ''

# Only one deploy at a time; a new run cancels the queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Assemble a single folder with the exact content of the remote
      # "dashboard/" directory, so the FTPS sync is one atomic pass.
      # Only the intended files are copied (never whole directories), so
      # dev-only or unexpected files can never reach the server.
      - name: Assemble deploy bundle
        run: |
          set -eu
          rm -rf release
          mkdir -p release/api release/data

          # 1) Compiled SPA: index.html + assets/… + root .htaccess (Basic Auth)
          cp -a frontend/dist/. release/

          # 2) Backend API (server side API, managed by metrics.php)
          cp deploy/api/metrics.php release/api/
          cp deploy/api/.htaccess release/api/
          # 2b) API documentation (shipped next to the API)
          cp deploy/api/HELP.html release/api/
          cp deploy/api/openapi.yaml release/api/

          # 3) data/ web protection only.
          #    deploy/data/config.php is deliberately NOT copied: it is the
          #    server-owned configuration (API_TOKEN, credentials, METRICS).
          #    deploy/.htaccess and deploy/router.php are NOT copied either:
          #    the root .htaccess comes from dist/ and router.php is dev-only.
          cp deploy/data/.htaccess release/data/

          echo "== release tree =="
          find release -type f | sort

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.ftp_host }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          protocol: ftps
          port: ${{ secrets.ftp_port || '21' }}
          local-dir: ./release/
          server-dir: ${{ inputs.deploy_dir || vars.DEPLOY_DIR || 'dashboard/' }}
          log-level: verbose

      # Keeps a downloadable copy of the exact bundle that was deployed.
      - name: Upload artifact (release/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpi-dashboard-release
          path: release
          if-no-files-found: warn
          retention-days: 7
