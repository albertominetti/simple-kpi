name: CI - Build frontend

# Builds the frontend on every push/PR and uploads dist/ as a downloadable
# artifact. Does NOT deploy (see prod-deploy.yml).

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify output
        run: |
          test -f dist/index.html
          test -n "$(ls dist/assets/index-*.js 2>/dev/null)"
          test -n "$(ls dist/assets/index-*.css 2>/dev/null)"
          echo "Build OK:"
          ls -la dist dist/assets

      # Uploads dist/ as a downloadable artifact from the run.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpi-dashboard-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
